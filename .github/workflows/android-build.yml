name: Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target CPU architecture'
        required: false
        default: 'armeabi-v7a'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - armeabi-v7a+arm64-v8a
          - x86
          - x86_64

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Patch expo-clipboard for Gradle compatibility
        run: |
          python3 - <<'EOF'
          f = 'node_modules/expo-clipboard/android/build.gradle'
          content = open(f).read()
          old = '    useExpoPublishing()\n    useCoreDependencies()'
          new = '    useDefaultAndroidSdkVersions()\n    useExpoPublishing()\n    useCoreDependencies()'
          if old in content:
              with open(f, 'w') as fh:
                  fh.write(content.replace(old, new))
              print('Patched expo-clipboard/android/build.gradle: added useDefaultAndroidSdkVersions()')
          else:
              print('expo-clipboard/android/build.gradle: pattern not found, skipping patch')
          EOF

      - name: Patch expo-modules-autolinking for Gradle compatibility
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          f = Path('node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-settings-plugin/src/main/kotlin/expo/modules/plugin/SettingsManager.kt')
          content = f.read_text()
          original_import = 'import org.gradle.internal.extensions.core.extra\n'
          original_usage = '      project.extra.set("coreFeatures", config.coreFeatures)\n'
          updated_content = content.replace(original_import, '')
          updated_content = updated_content.replace(
              original_usage,
              '      project.extensions.extraProperties.set("coreFeatures", config.coreFeatures)\n',
          )
          if updated_content != content:
              f.write_text(updated_content)
              print('Patched expo-modules-autolinking SettingsManager.kt for Gradle compatibility')
          else:
              print('expo-modules-autolinking SettingsManager.kt: pattern not found, skipping patch')
          EOF

      - name: Patch expo-modules-core for Gradle compatibility
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          replacements = {
            'node_modules/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/gradle/ExpoModuleExtension.kt': [
              ('import org.gradle.internal.extensions.core.extra\n', ''),
              ('    return project.rootProject.extra.safeGet<Any>(name) ?: default\n', '    return project.rootProject.extensions.extraProperties.safeGet<Any>(name) ?: default\n'),
            ],
            'node_modules/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/ProjectConfiguration.kt': [
              ('import org.gradle.internal.extensions.core.extra\n', ''),
              ('  extra.set("kotlinVersion", kotlinVersion)\n', '  project.extensions.extraProperties.set("kotlinVersion", kotlinVersion)\n'),
              ('  extra.set("kspVersion", kspVersion)\n', '  project.extensions.extraProperties.set("kspVersion", kspVersion)\n'),
              ('      compileSdk = rootProject.extra.safeGet("compileSdkVersion")\n', '      compileSdk = rootProject.extensions.extraProperties.safeGet("compileSdkVersion")\n'),
              ('      minSdk = rootProject.extra.safeGet("minSdkVersion")\n', '      minSdk = rootProject.extensions.extraProperties.safeGet("minSdkVersion")\n'),
              ('      targetSdk = rootProject.extra.safeGet("targetSdkVersion")\n', '      targetSdk = rootProject.extensions.extraProperties.safeGet("targetSdkVersion")\n'),
            ],
            'node_modules/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/ExpoModulesGradlePlugin.kt': [
              ('import org.gradle.internal.extensions.core.extra\n', ''),
              ('    return project.rootProject.extra.safeGet<String>("kotlinVersion")\n', '    return project.rootProject.extensions.extraProperties.safeGet<String>("kotlinVersion")\n'),
              ('    return project.rootProject.extra.safeGet<String>("kspVersion")\n', '    return project.rootProject.extensions.extraProperties.safeGet<String>("kspVersion")\n'),
            ],
          }

          changed = False
          for file_path, file_replacements in replacements.items():
            path = Path(file_path)
            content = path.read_text()
            updated_content = content
            for old, new in file_replacements:
              updated_content = updated_content.replace(old, new)
            if updated_content != content:
              path.write_text(updated_content)
              changed = True

          if changed:
            print('Patched expo-modules-core Gradle plugin sources for compatibility')
          else:
            print('expo-modules-core Gradle plugin sources: pattern not found, skipping patch')
          EOF

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch generated settings.gradle for React settings import
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          f = Path('android/settings.gradle')
          content = f.read_text()
          import_line = 'import com.facebook.react.ReactSettingsExtension\n'
          original_block = (
              'extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->\n'
              "  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {\n"
              '    ex.autolinkLibrariesFromCommand()\n'
              '  } else {\n'
              '    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)\n'
              '  }\n'
              '}\n'
          )
          updated_content = content.replace(import_line, '')
          updated_content = updated_content.replace(original_block, '')
          if updated_content != content:
              f.write_text(updated_content)
              print('Patched android/settings.gradle for ReactSettingsExtension import')
          else:
              print('android/settings.gradle: pattern not found, skipping patch')
          EOF

      - name: Configure ABI filter
        env:
          TARGET_ABI: ${{ github.event.inputs.architecture }}
        run: |
          if [ "$TARGET_ABI" = "all" ] || [ -z "$TARGET_ABI" ] || [ "$TARGET_ABI" = "null" ]; then
            echo "Building universal APK (all architectures)"
          else
            python3 - <<'PYEOF'
          import re, os
          abi = os.environ['TARGET_ABI']
          # Support combined architectures separated by '+', e.g. "armeabi-v7a+arm64-v8a"
          abi_filters = ', '.join(f'"{a}"' for a in abi.split('+'))
          f = 'android/app/build.gradle'
          content = open(f).read()
          # Inject ndk.abiFilters inside the defaultConfig block so only the
          # requested ABI(s) are included, producing a smaller APK.
          content = re.sub(
      - name: Patch expo-modules-core for Gradle compatibility
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          files = {
              'node_modules/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/gradle/ExpoModuleExtension.kt': [
                  ('import org.gradle.internal.extensions.core.extra\n', ''),
                  ('    return project.rootProject.extra.safeGet<Any>(name) ?: default\n', '    return project.rootProject.extensions.extraProperties.safeGet<Any>(name) ?: default\n'),
              ],
              'node_modules/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/ProjectConfiguration.kt': [
                  ('import org.gradle.internal.extensions.core.extra\n', ''),
                  ('  extra.set("kotlinVersion", kotlinVersion)\n', '  project.extensions.extraProperties.set("kotlinVersion", kotlinVersion)\n'),
                  ('  extra.set("kspVersion", kspVersion)\n', '  project.extensions.extraProperties.set("kspVersion", kspVersion)\n'),
                  ('      compileSdk = rootProject.extra.safeGet("compileSdkVersion")\n', '      compileSdk = rootProject.extensions.extraProperties.safeGet("compileSdkVersion")\n'),
                  ('      minSdk = rootProject.extra.safeGet("minSdkVersion")\n', '      minSdk = rootProject.extensions.extraProperties.safeGet("minSdkVersion")\n'),
                  ('      targetSdk = rootProject.extra.safeGet("targetSdkVersion")\n', '      targetSdk = rootProject.extensions.extraProperties.safeGet("targetSdkVersion")\n'),
              ],
              'node_modules/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/ExpoModulesGradlePlugin.kt': [
                  ('import org.gradle.internal.extensions.core.extra\n', ''),
                  ('    return project.rootProject.extra.safeGet<String>("kotlinVersion")\n', '    return project.rootProject.extensions.extraProperties.safeGet<String>("kotlinVersion")\n'),
                  ('    return project.rootProject.extra.safeGet<String>("kspVersion")\n', '    return project.rootProject.extensions.extraProperties.safeGet<String>("kspVersion")\n'),
              ],
          }

          changed = False
          for file_path, replacements in files.items():
              path = Path(file_path)
              content = path.read_text()
              updated_content = content
              for old, new in replacements:
                  updated_content = updated_content.replace(old, new)
              if updated_content != content:
                  path.write_text(updated_content)
                  changed = True

          if changed:
              print('Patched expo-modules-core Gradle plugin sources for compatibility')
          else:
              print('expo-modules-core Gradle plugin sources: pattern not found, skipping patch')
          EOF
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -noprompt
          if [ ! -f android/app/release.keystore.pkcs12 ]; then
            echo "Error: PKCS12 keystore was not created by keytool" >&2
            exit 1
          fi
          mv android/app/release.keystore.pkcs12 android/app/release.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Remove sensitive files
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f android/app/release.keystore
          rm -f android/app/release.keystore.pkcs12

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jambgenius-release-${{ github.event.inputs.architecture || 'all' }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
